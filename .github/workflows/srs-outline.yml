name: SRS requirement outline
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  outline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PDF text reader
        run: python -m pip install pypdf==5.9.0
      - name: Print SRS requirement sections for traceability
        run: python scripts/srs_outline.py
